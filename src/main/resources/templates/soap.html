<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOAP | Forex Horizon</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/site.css"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><h1>MNB SOAP · Exchange rates</h1><p>Historic Hungarian National Bank reference rates (HUF per unit of selected currency).</p><form method="post" action="/soap" class="info"><div class="row g-3 align-items-end"><div class="col-md-3"><label class="form-label" for="currency">Currency</label><select class="form-select" name="currency" id="currency"><option th:each="c : ${ {'EUR','USD','GBP','CHF','JPY','CZK','PLN','RON'} }" th:value="${c}" th:text="${c}" th:selected="${c == currency}"></option></select></div><div class="col-md-3"><label class="form-label" for="start">Start date</label><input class="form-control" required type="date" name="start" id="start" th:value="${start}"></div><div class="col-md-3"><label class="form-label" for="end">End date</label><input class="form-control" required type="date" name="end" id="end" th:value="${end}"></div><div class="col-md-3"><button class="btn btn-primary w-100">Retrieve rates</button></div></div></form><div class="alert alert-danger mt-3" th:if="${error}" th:text="${error}"></div><section th:if="${rates != null}" class="mt-4"><h2>Results</h2><div th:if="${#lists.isEmpty(rates)}" class="alert alert-warning">No data returned for the selected dates.</div><div th:unless="${#lists.isEmpty(rates)}" class="info mb-4"><canvas id="ratesChart" height="120"></canvas></div><table class="table table-striped"><thead><tr><th>Date</th><th>Currency</th><th>HUF rate</th></tr></thead><tbody><tr th:each="r : ${rates}"><td th:text="${r.date}"></td><td th:text="${r.currency}"></td><td th:text="${r.value}"></td></tr></tbody></table></section><script th:if="${rates != null}" th:inline="javascript">const labels=/*[[${labels}]]*/ [];const values=/*[[${values}]]*/ [];if(labels.length){new Chart(document.getElementById('ratesChart'),{type:'line',data:{labels:labels,datasets:[{label:'HUF reference rate',data:values,borderColor:'#11a9b4',tension:0.2}]},options:{responsive:true}});}</script></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
