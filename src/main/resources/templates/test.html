<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test | Forex Horizon</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/site.css"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container py-5"><h1>Test menu · Calculator</h1><p class="text-secondary">Four operations; JUnit and MockMvc tests verify correct results and invalid input.</p><form action="/test" method="post" class="info col-lg-7"><div class="row g-3"><div class="col-md-6"><label for="a" class="form-label">First number</label><input class="form-control" required id="a" name="a" type="number" step="any" th:value="${a}"></div><div class="col-md-6"><label for="b" class="form-label">Second number</label><input class="form-control" required id="b" name="b" type="number" step="any" th:value="${b}"></div><div class="col-12"><label class="form-label" for="operation">Operation</label><select class="form-select" id="operation" name="operation"><option value="add">Add (+)</option><option value="subtract">Subtract (−)</option><option value="multiply">Multiply (×)</option><option value="divide">Divide (÷)</option></select></div><div><button class="btn btn-primary" type="submit">Calculate</button></div></div></form><div th:if="${result != null}" class="alert alert-success mt-3">Result: <strong th:text="${result}"></strong></div><div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
